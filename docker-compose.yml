
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: couple-expense-backend
    ports:
      - "3000:3000"
    volumes:
      - ./server/database.sqlite:/app/database.sqlite
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: couple-expense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    env_file:
      - .env
    restart: always

volumes:
  db_data:
