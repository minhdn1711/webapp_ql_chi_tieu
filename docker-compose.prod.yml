version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/minhdn1711/webapp_ql_chi_tieu-backend:main
    container_name: couple-expense-backend
    # ports:
    #   - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - webdongho-network
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/minhdn1711/webapp_ql_chi_tieu-frontend:main
    container_name: couple-expense-frontend
    # ports:
    #   - "80:80"
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - webdongho-network
    restart: always

networks:
  webdongho-network:
    external: true
    name: webdongho_webdongho-network
